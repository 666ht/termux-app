name: Build Chinese Termux ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

# Avoid duplicate expensive bootstrap builds when several commits are pushed quickly.
concurrency:
  group: termux-chinese-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build custom-prefix ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Termux app sources
        uses: actions/checkout@v6

      # Pin the upstream generator for repeatable bootstrap generation and cache keys.
      # Refresh this SHA intentionally when updating the package-generation logic.
      - name: Checkout Termux package build sources
        uses: actions/checkout@v6
        with:
          repository: termux/termux-packages
          ref: 722e439ac82412f7e26536fb6c18686a3b9d7625
          path: termux-packages

      - name: Get bootstrap source revision
        id: bootstrap-source
        shell: bash
        run: echo "sha=$(git -C termux-packages rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache custom-prefix ARM64 bootstrap
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-aarch64.zip
          key: ${{ runner.os }}-bootstrap-aarch64-${{ steps.bootstrap-source.outputs.sha }}-zhcn-repo-v2
          # Do not restore a bootstrap built from a different upstream revision.

      - name: Generate runtime-only ARM64 bootstrap
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TERMUX_APP_PACKAGE_NAME_OVERRIDE: com.termux.zhcn
        run: |
          set -euo pipefail
          cd termux-packages

          # Use the upstream generator: it downloads the bootstrap package set and their runtime
          # dependencies instead of bundling all locally built build-dependency packages.
          grep -q '^TERMUX_APP__PACKAGE_NAME="com.termux"$' scripts/properties.sh
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"$/TERMUX_APP__PACKAGE_NAME="${TERMUX_APP_PACKAGE_NAME_OVERRIDE:-com.termux}"/' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="${TERMUX_APP_PACKAGE_NAME_OVERRIDE:-com.termux}"$' scripts/properties.sh

          # Retry transient package-mirror failures.
          sed -i 's/curl --fail --location/curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location/g' scripts/generate-bootstraps.sh

          # Some runtime package sets do not create etc/profile.d; create it before the upstream
          # fallback script writes the legacy bootstrap initialization file.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/generate-bootstraps.sh")
          lines = path.read_text().splitlines(keepends=True)
          for index, line in enumerate(lines):
              if line.strip() == "# TODO: Remove it when Termux app supports `pacman` bootstraps installation.":
                  lines.insert(index + 1, '\tmkdir -p "${BOOTSTRAP_ROOTFS}/${TERMUX__PREFIX__PROFILE_D_DIR}"\n')
                  break
          else:
              raise SystemExit("Could not find bootstrap fallback block; refusing an incomplete bootstrap.")
          path.write_text("".join(lines))
          PY

          TERMUX_APP_PACKAGE_NAME_OVERRIDE=com.termux.zhcn ./scripts/generate-bootstraps.sh --architectures aarch64

          BOOTSTRAP="$PWD/bootstrap-aarch64.zip"
          test -s "$BOOTSTRAP"
          unzip -tq "$BOOTSTRAP"
          BOOTSTRAP_SIZE="$(stat -c '%s' "$BOOTSTRAP")"
          echo "Runtime-only ARM64 bootstrap size: $BOOTSTRAP_SIZE bytes"
          if (( BOOTSTRAP_SIZE > 60000000 )); then
            echo "ERROR: Runtime-only bootstrap exceeds 60 MB; refusing to package an oversized APK." >&2
            exit 1
          fi
          install -D -m 0644 "$BOOTSTRAP" "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip"

      - name: Verify ARM64 bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/cpp/bootstrap-aarch64.zip
          unzip -tq app/src/main/cpp/bootstrap-aarch64.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache native ARM64 build intermediates
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/ndkBuild
            app/build/intermediates/cxx
          key: ${{ runner.os }}-arm64-native-${{ hashFiles('app/build.gradle', 'app/src/main/cpp/**', 'termux-shared/src/main/cpp/**', '**/Android.mk', '**/Application.mk') }}
          restore-keys: |
            ${{ runner.os }}-arm64-native-

      - name: Build Chinese coexisting APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_PACKAGE_NAME: com.termux.zhcn
          TERMUX_CUSTOM_BOOTSTRAP: '1'
        run: |
          set -euo pipefail
          CURRENT_VERSION_NAME="$(grep -m 1 -E 'versionName "[^"]+"' ./app/build.gradle | cut -d '"' -f2)"
          test -n "$CURRENT_VERSION_NAME"
          RELEASE_VERSION_NAME="$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-apt-android-7-zhcn-github"
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          DIST_DIR_PATH="$GITHUB_WORKSPACE/dist"
          export TERMUX_APP_VERSION_NAME="$RELEASE_VERSION_NAME"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

          # Fail the job unless the exact ARM64 APK exists and is non-empty.
          APK_SOURCE="$APK_DIR_PATH/termux-app_${APK_VERSION_TAG}_arm64-v8a.apk"
          if [[ ! -s "$APK_SOURCE" ]]; then
            echo "ERROR: Expected ARM64 APK was not produced: $APK_SOURCE" >&2
            echo "Actual APK outputs:" >&2
            find ./app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          APK_SIZE_BYTES="$(stat -c '%s' "$APK_SOURCE")"
          echo "Final ARM64 APK size: $APK_SIZE_BYTES bytes"
          if (( APK_SIZE_BYTES > 60000000 )); then
            echo "ERROR: Final ARM64 APK exceeds 60 MB; refusing to publish an oversized build." >&2
            exit 1
          fi

          # Stage a stable, easy-to-find filename for the single downloadable artifact.
          mkdir -p "$DIST_DIR_PATH"
          cp "$APK_SOURCE" "$DIST_DIR_PATH/termux-chinese-arm64.apk"
          test -s "$DIST_DIR_PATH/termux-chinese-arm64.apk"
          (cd "$DIST_DIR_PATH" && sha256sum termux-chinese-arm64.apk > SHA256SUMS.txt)
          echo "Verified APK output: $DIST_DIR_PATH/termux-chinese-arm64.apk"
          ls -lh "$DIST_DIR_PATH/termux-chinese-arm64.apk" "$DIST_DIR_PATH/SHA256SUMS.txt"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-chinese-arm64-${{ github.sha }}
          path: |
            dist/termux-chinese-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach the same ARM64 APK to the published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termux-chinese-arm64.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
