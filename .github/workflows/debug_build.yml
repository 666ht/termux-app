name: Build Chinese Termux ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

# Avoid duplicate expensive bootstrap builds when several commits are pushed quickly.
concurrency:
  group: termux-chinese-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build custom-prefix ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Termux app sources
        uses: actions/checkout@v6

      # Pin the package recipes to the revision matching the existing ARM64 bootstrap cache.
      # Update this SHA deliberately when refreshing the bootstrap; tracking master invalidates
      # the exact cache key whenever upstream advances and forces a multi-hour rebuild.
      - name: Checkout Termux package build sources
        uses: actions/checkout@v6
        with:
          repository: termux/termux-packages
          ref: b654a8ce68cad3977403aa54491d2abb613d354d
          path: termux-packages

      - name: Get bootstrap source revision
        id: bootstrap-source
        shell: bash
        run: echo "sha=$(git -C termux-packages rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache custom-prefix ARM64 bootstrap
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-aarch64.zip
          key: ${{ runner.os }}-bootstrap-aarch64-${{ steps.bootstrap-source.outputs.sha }}-zhcn-v3
          # Do not restore a bootstrap built from a different upstream revision.

      - name: Build bootstrap for the coexisting package ID
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env TERMUX_APP_PACKAGE_NAME_OVERRIDE=com.termux.zhcn
        run: |
          set -euo pipefail
          cd termux-packages
          # The bootstrap builder cannot write its output into the checkout bind mount.
          # Mount a separate runner-owned output directory into the container instead.
          mkdir -p "$RUNNER_TEMP/bootstrap-output"
          chmod 0777 "$RUNNER_TEMP/bootstrap-output"
          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume $RUNNER_TEMP/bootstrap-output:/bootstrap-output"

          # Patch source files on the runner before invoking the builder container.
          grep -q 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          sed -i 's/PACKAGES+=("bzip2")/PACKAGES+=("libbz2")/' scripts/build-bootstraps.sh
          ! grep -q 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="com.termux"$' scripts/properties.sh
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"$/TERMUX_APP__PACKAGE_NAME="${TERMUX_APP_PACKAGE_NAME_OVERRIDE:-com.termux}"/' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="${TERMUX_APP_PACKAGE_NAME_OVERRIDE:-com.termux}"$' scripts/properties.sh

          cat > scripts/filter-bootstrap-runtime-debs.py <<'PY'
          #!/usr/bin/env python3
          """Keep only bootstrap runtime packages, excluding build-only dependency DEBs."""
          from collections import defaultdict, deque
          from pathlib import Path
          import re
          import subprocess
          import sys

          output_dir = Path(sys.argv[1])
          target_arch = sys.argv[2]
          roots_file = Path(sys.argv[3])
          roots = [line.strip() for line in roots_file.read_text().splitlines() if line.strip()]

          def read_control(path):
              proc = subprocess.run(
                  ["dpkg-deb", "-f", str(path)],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
              )
              if proc.returncode:
                  return None
              fields = {}
              current = None
              for line in proc.stdout.splitlines():
                  if line.startswith((" ", "\t")):
                      if current:
                          fields[current] += " " + line.strip()
                  else:
                      key, sep, value = line.partition(":")
                      if sep:
                          current = key.strip().lower()
                          fields[current] = value.strip()
              return fields

          def split_top_level(value, separator):
              parts, current, depth = [], [], 0
              for char in value:
                  if char in "([<":
                      depth += 1
                  elif char in ")]>":
                      depth = max(0, depth - 1)
                  if char == separator and depth == 0:
                      parts.append("".join(current).strip())
                      current = []
                  else:
                      current.append(char)
              if current:
                  parts.append("".join(current).strip())
              return [part for part in parts if part]

          def package_name(value):
              match = re.match(r"\s*([a-z0-9][a-z0-9+.-]*)", value, re.IGNORECASE)
              return match.group(1) if match else None

          records = []
          by_name = defaultdict(list)
          for path in sorted(output_dir.glob("*.deb")):
              fields = read_control(path)
              if not fields or not fields.get("package"):
                  continue
              record = {
                  "path": path,
                  "name": fields["package"],
                  "arch": fields.get("architecture", "all"),
                  "version": fields.get("version", "0"),
                  "fields": fields,
              }
              records.append(record)
              if record["arch"] in (target_arch, "all") and not record["name"].endswith("-static"):
                  by_name[record["name"]].append(record)

          if not by_name:
              raise SystemExit(f"No compatible DEB packages found in {output_dir}")

          def newer_version(left, right):
              proc = subprocess.run(
                  ["dpkg", "--compare-versions", left, "gt", right],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              )
              return proc.returncode == 0

          def choose(candidates):
              best = candidates[0]
              for candidate in candidates[1:]:
                  if candidate["arch"] == target_arch and best["arch"] != target_arch:
                      best = candidate
                  elif candidate["arch"] == best["arch"] and newer_version(candidate["version"], best["version"]):
                      best = candidate
              return best

          providers = defaultdict(set)
          for name, candidates in by_name.items():
              for record in candidates:
                  for item in split_top_level(record["fields"].get("provides", ""), ","):
                      provided_name = package_name(item)
                      if provided_name:
                          providers[provided_name].add(name)

          def resolve(name):
              if name in by_name:
                  return choose(by_name[name])
              for provider_name in sorted(providers.get(name, ())):
                  if provider_name in by_name:
                      return choose(by_name[provider_name])
              return None

          selected = {}
          queue = deque()
          for root in roots:
              if not resolve(root):
                  raise SystemExit(f"Required bootstrap package '{root}' has no compatible DEB; refusing to build an incomplete bootstrap.")
              queue.append(root)

          while queue:
              name = queue.popleft()
              if name in selected:
                  continue
              record = resolve(name)
              if record is None:
                  raise SystemExit(f"Runtime dependency '{name}' has no compatible DEB.")
              selected[name] = record
              fields = record["fields"]
              for field in ("pre-depends", "depends"):
                  for group in split_top_level(fields.get(field, ""), ","):
                      resolved = None
                      for alternative in split_top_level(group, "|"):
                          dep_name = package_name(alternative)
                          if dep_name:
                              resolved = resolve(dep_name)
                              if resolved:
                                  break
                      if resolved is None:
                          raise SystemExit(
                              f"Cannot resolve runtime dependency '{group}' required by '{name}'. "
                              "Refusing to publish an incomplete bootstrap."
                          )
                      if resolved["name"] not in selected:
                          queue.append(resolved["name"])

          keep_paths = {record["path"] for record in selected.values()}
          removed = 0
          removed_bytes = 0
          for record in records:
              if record["path"] not in keep_paths:
                  try:
                      removed_bytes += record["path"].stat().st_size
                      record["path"].unlink()
                      removed += 1
                  except FileNotFoundError:
                      pass

          print(
              f"Runtime dependency filter: keeping {len(selected)} packages "
              f"({', '.join(sorted(selected))}); removed {removed} unrelated/build-only DEBs "
              f"({removed_bytes} bytes)."
          )
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build-bootstraps.sh")
          source = path.read_text()
          old = 'mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"'
          new = 'mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" /bootstrap-output/'
          if old not in source:
              raise SystemExit("Expected bootstrap output command was not found; stopping to avoid an incorrect build.")
          source = source.replace(old, new, 1)

          old_extract = '\t\t# Extract all debs.\n\t\textract_debs "$TERMUX_ARCH" || return $?'
          new_extract = (
              '\t\t# Keep only bootstrap roots and their runtime dependency closure.\n'
              '\t\tprintf "%s\\n" "${PACKAGES[@]}" > "$BOOTSTRAP_TMPDIR/bootstrap-runtime-roots-${TERMUX_ARCH}.txt"\n'
              '\t\tpython3 "$TERMUX_PACKAGES_DIRECTORY/scripts/filter-bootstrap-runtime-debs.py" "$TERMUX_BUILT_DEBS_DIRECTORY" "$TERMUX_ARCH" "$BOOTSTRAP_TMPDIR/bootstrap-runtime-roots-${TERMUX_ARCH}.txt"\n'
              '\t\t# Extract only required runtime packages.\n'
              '\t\textract_debs "$TERMUX_ARCH" || return $?'
          )
          if old_extract not in source:
              raise SystemExit("Expected bootstrap DEB extraction block was not found; stopping rather than building an oversized bootstrap.")
          source = source.replace(old_extract, new_extract, 1)
          path.write_text(source)
          PY

          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64
          test -s "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip"

          # Bootstrap packages may include installed test suites that are not needed at runtime.
          # Remove only libexec/installed-tests; preserve commands, libraries, configuration and docs.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          import tempfile

          archive = Path(os.environ["RUNNER_TEMP"]) / "bootstrap-output/bootstrap-aarch64.zip"
          fd, temp_name = tempfile.mkstemp(suffix=".zip", dir=archive.parent)
          os.close(fd)
          removed = 0
          try:
              with ZipFile(archive, "r") as source, ZipFile(temp_name, "w", ZIP_DEFLATED, compresslevel=9) as target:
                  for item in source.infolist():
                      normalized = "/" + item.filename.strip("/") + "/"
                      if "/libexec/installed-tests/" in normalized:
                          removed += 1
                          continue
                      target.writestr(item, source.read(item.filename))
              os.replace(temp_name, archive)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)
          print(f"Removed {removed} non-runtime installed-test files")
          print(f"Pruned bootstrap archive size: {archive.stat().st_size} bytes")
          PY

          unzip -tq "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip"
          BOOTSTRAP_SIZE="$(stat -c '%s' "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip")"
          echo "Runtime-only ARM64 bootstrap size: $BOOTSTRAP_SIZE bytes"
          if (( BOOTSTRAP_SIZE > 60000000 )); then
            echo "ERROR: Bootstrap is still unexpectedly large ($BOOTSTRAP_SIZE bytes); refusing to package it into the APK." >&2
            exit 1
          fi
          install -D -m 0644 "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip" "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip"

      - name: Verify ARM64 bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/cpp/bootstrap-aarch64.zip
          unzip -tq app/src/main/cpp/bootstrap-aarch64.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache native ARM64 build intermediates
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/ndkBuild
            app/build/intermediates/cxx
          key: ${{ runner.os }}-arm64-native-${{ hashFiles('app/build.gradle', 'app/src/main/cpp/**', 'termux-shared/src/main/cpp/**', '**/Android.mk', '**/Application.mk') }}
          restore-keys: |
            ${{ runner.os }}-arm64-native-

      - name: Build Chinese coexisting APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_PACKAGE_NAME: com.termux.zhcn
          TERMUX_CUSTOM_BOOTSTRAP: '1'
        run: |
          set -euo pipefail
          CURRENT_VERSION_NAME="$(grep -m 1 -E 'versionName "[^"]+"' ./app/build.gradle | cut -d '"' -f2)"
          test -n "$CURRENT_VERSION_NAME"
          RELEASE_VERSION_NAME="$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-apt-android-7-zhcn-github"
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          DIST_DIR_PATH="$GITHUB_WORKSPACE/dist"
          export TERMUX_APP_VERSION_NAME="$RELEASE_VERSION_NAME"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          ./gradlew assembleDebug --no-daemon --stacktrace

          # Fail the job unless the exact ARM64 APK exists and is non-empty.
          APK_SOURCE="$APK_DIR_PATH/termux-app_${APK_VERSION_TAG}_arm64-v8a.apk"
          if [[ ! -s "$APK_SOURCE" ]]; then
            echo "ERROR: Expected ARM64 APK was not produced: $APK_SOURCE" >&2
            echo "Actual APK outputs:" >&2
            find ./app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          APK_SIZE_BYTES="$(stat -c '%s' "$APK_SOURCE")"
          echo "Final ARM64 APK size: $APK_SIZE_BYTES bytes"
          if (( APK_SIZE_BYTES > 60000000 )); then
            echo "ERROR: Final ARM64 APK exceeds 60 MB; refusing to publish an oversized build." >&2
            exit 1
          fi

          # Stage a stable, easy-to-find filename for the single downloadable artifact.
          mkdir -p "$DIST_DIR_PATH"
          cp "$APK_SOURCE" "$DIST_DIR_PATH/termux-chinese-arm64.apk"
          test -s "$DIST_DIR_PATH/termux-chinese-arm64.apk"
          (cd "$DIST_DIR_PATH" && sha256sum termux-chinese-arm64.apk > SHA256SUMS.txt)
          echo "Verified APK output: $DIST_DIR_PATH/termux-chinese-arm64.apk"
          ls -lh "$DIST_DIR_PATH/termux-chinese-arm64.apk" "$DIST_DIR_PATH/SHA256SUMS.txt"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-chinese-arm64-${{ github.sha }}
          path: |
            dist/termux-chinese-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach the same ARM64 APK to the published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termux-chinese-arm64.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
