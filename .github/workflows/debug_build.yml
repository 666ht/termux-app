name: Build Chinese Termux ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

# Avoid duplicate expensive bootstrap builds when several commits are pushed quickly.
concurrency:
  group: termux-chinese-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build custom-prefix ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Termux app sources
        uses: actions/checkout@v6

      - name: Checkout Termux package build sources
        uses: actions/checkout@v6
        with:
          repository: termux/termux-packages
          ref: master
          path: termux-packages

      - name: Get bootstrap source revision
        id: bootstrap-source
        shell: bash
        run: echo "sha=$(git -C termux-packages rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache custom-prefix ARM64 bootstrap
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-aarch64.zip
          key: ${{ runner.os }}-bootstrap-aarch64-${{ steps.bootstrap-source.outputs.sha }}-zhcn-v2

      - name: Build bootstrap for the coexisting package ID
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env TERMUX_APP_PACKAGE_NAME_OVERRIDE=com.termux.zhcn
        run: |
          set -euo pipefail
          cd termux-packages
          # The bootstrap builder cannot write its output into the checkout bind mount.
          # Mount a separate runner-owned output directory into the container instead.
          mkdir -p "$RUNNER_TEMP/bootstrap-output"
          chmod 0777 "$RUNNER_TEMP/bootstrap-output"
          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume $RUNNER_TEMP/bootstrap-output:/bootstrap-output"

          # Patch source files on the runner before invoking the builder container.
          grep -q 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          sed -i 's/PACKAGES+=("bzip2")/PACKAGES+=("libbz2")/' scripts/build-bootstraps.sh
          ! grep -q 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="com.termux"$' scripts/properties.sh
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"$/TERMUX_APP__PACKAGE_NAME="${TERMUX_APP_PACKAGE_NAME_OVERRIDE:-com.termux}"/' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="${TERMUX_APP_PACKAGE_NAME_OVERRIDE:-com.termux}"$' scripts/properties.sh

          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build-bootstraps.sh")
          source = path.read_text()
          old = 'mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"'
          new = 'mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" /bootstrap-output/'
          if old not in source:
              raise SystemExit("Expected bootstrap output command was not found; stopping to avoid an incorrect build.")
          path.write_text(source.replace(old, new, 1))
          PY

          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64
          test -s "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip"

          # Bootstrap packages may include installed test suites that are not needed at runtime.
          # Remove only libexec/installed-tests; preserve commands, libraries, configuration and docs.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          import tempfile

          archive = Path(os.environ["RUNNER_TEMP"]) / "bootstrap-output/bootstrap-aarch64.zip"
          fd, temp_name = tempfile.mkstemp(suffix=".zip", dir=archive.parent)
          os.close(fd)
          removed = 0
          try:
              with ZipFile(archive, "r") as source, ZipFile(temp_name, "w", ZIP_DEFLATED, compresslevel=9) as target:
                  for item in source.infolist():
                      normalized = "/" + item.filename.strip("/") + "/"
                      if "/libexec/installed-tests/" in normalized:
                          removed += 1
                          continue
                      target.writestr(item, source.read(item.filename))
              os.replace(temp_name, archive)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)
          print(f"Removed {removed} non-runtime installed-test files")
          print(f"Pruned bootstrap archive size: {archive.stat().st_size} bytes")
          PY

          unzip -t "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip"
          install -D -m 0644 "$RUNNER_TEMP/bootstrap-output/bootstrap-aarch64.zip" "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip"

      - name: Verify ARM64 bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/cpp/bootstrap-aarch64.zip
          unzip -t app/src/main/cpp/bootstrap-aarch64.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache native ARM64 build intermediates
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/ndkBuild
            app/build/intermediates/cxx
          key: ${{ runner.os }}-arm64-native-${{ hashFiles('app/build.gradle', 'app/src/main/cpp/**', 'termux-shared/src/main/cpp/**', '**/Android.mk', '**/Application.mk') }}
          restore-keys: |
            ${{ runner.os }}-arm64-native-

      - name: Build Chinese coexisting APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_PACKAGE_NAME: com.termux.zhcn
          TERMUX_CUSTOM_BOOTSTRAP: '1'
        run: |
          set -euo pipefail
          CURRENT_VERSION_NAME="$(grep -m 1 -E 'versionName "[^"]+"' ./app/build.gradle | cut -d '"' -f2)"
          test -n "$CURRENT_VERSION_NAME"
          RELEASE_VERSION_NAME="$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-apt-android-7-zhcn-github"
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          DIST_DIR_PATH="$GITHUB_WORKSPACE/dist"
          export TERMUX_APP_VERSION_NAME="$RELEASE_VERSION_NAME"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          ./gradlew assembleDebug --no-daemon --stacktrace

          # Fail the job unless the exact ARM64 APK exists and is non-empty.
          APK_SOURCE="$APK_DIR_PATH/termux-app_${APK_VERSION_TAG}_arm64-v8a.apk"
          if [[ ! -s "$APK_SOURCE" ]]; then
            echo "ERROR: Expected ARM64 APK was not produced: $APK_SOURCE" >&2
            echo "Actual APK outputs:" >&2
            find ./app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi

          # Stage a stable, easy-to-find filename for the single downloadable artifact.
          mkdir -p "$DIST_DIR_PATH"
          cp "$APK_SOURCE" "$DIST_DIR_PATH/termux-chinese-arm64.apk"
          test -s "$DIST_DIR_PATH/termux-chinese-arm64.apk"
          (cd "$DIST_DIR_PATH" && sha256sum termux-chinese-arm64.apk > SHA256SUMS.txt)
          echo "Verified APK output: $DIST_DIR_PATH/termux-chinese-arm64.apk"
          ls -lh "$DIST_DIR_PATH/termux-chinese-arm64.apk" "$DIST_DIR_PATH/SHA256SUMS.txt"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-chinese-arm64-${{ github.sha }}
          path: |
            dist/termux-chinese-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach the same ARM64 APK to the published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termux-chinese-arm64.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
