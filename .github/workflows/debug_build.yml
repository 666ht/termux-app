name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail
          CURRENT_VERSION_NAME="$(grep -m 1 -E 'versionName "[^"]+"' ./app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\\1/')"
          test -n "$CURRENT_VERSION_NAME"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          echo "Building $RELEASE_VERSION_NAME / $PACKAGE_VARIANT"
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-$PACKAGE_VARIANT-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> "$GITHUB_ENV"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          ./gradlew assembleDebug --no-daemon --stacktrace
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk" || { echo "Missing APK: $abi"; exit 1; }
          done
          (cd "$APK_DIR_PATH"; sha256sum "${APK_BASENAME_PREFIX}"_*.apk > "${APK_BASENAME_PREFIX}_sha256sums")

      - name: Attach APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}
          path: ${{ env.APK_DIR_PATH }}/*
          if-no-files-found: error
