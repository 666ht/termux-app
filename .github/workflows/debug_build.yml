name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.package_variant }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.package_variant }}-
            ${{ runner.os }}-gradle-

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail
          CURRENT_VERSION_NAME="$(grep -m 1 -E 'versionName "[^"]+"' ./app/build.gradle | cut -d '"' -f2)"
          test -n "$CURRENT_VERSION_NAME"
          RELEASE_VERSION_NAME="$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          echo "Building $RELEASE_VERSION_NAME / $PACKAGE_VARIANT"
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-$PACKAGE_VARIANT-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> "$GITHUB_ENV"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          ./gradlew assembleDebug --no-daemon --stacktrace
          find "$APK_DIR_PATH" -maxdepth 1 -type f -name "*.apk" -print
          APK_COUNT="$(find "$APK_DIR_PATH" -maxdepth 1 -type f -name "*.apk" | wc -l)"
          test "$APK_COUNT" -gt 0
          (cd "$APK_DIR_PATH"; sha256sum *.apk > "${APK_BASENAME_PREFIX}_sha256sums")

      - name: Attach APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
          if-no-files-found: error

# Trigger a fresh APK build after the Chinese runtime localization fix.
